<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasto Mensal por Categoria</title>
    <link rel="stylesheet" href="Gmmc.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="perfil-saudacao">
            <a href="HomePage.html" class="btn-voltar" title="Voltar para a Home">
                <span><img src="img/homepage.png" alt="Voltar"></span>
            </a>
            <div class="avatar-perfil">
                <img src="img/perfil.png" alt="Foto de Perfil">
            </div>
            <h1 class="Saudacao">Olá Gabriel Dutra</h1>
        </div>

        <div class="ChatNotificacoes">
            <button type="button"><img src="img/balao-de-fala.png" alt="Chat"></button>
            <button type="button"><img src="img/notificacao.png" alt="Notificações"></button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="dashboard-flex">
        <section class="box-relatorio-conteudo">
            
            <!-- 1. SELETOR DE CATEGORIAS (PILLS) -->
            <div class="seletor-categorias-container">
                <span class="titulo-seletor">Selecione a Categoria</span>
                <div class="categorias-pills" id="containerPills">
                    <button type="button" class="pill-categoria ativo" data-categoria-id="1" data-categoria="Alimentos">Alimentos</button>
                    <button type="button" class="pill-categoria" data-categoria-id="2" data-categoria="Limpeza">Limpeza</button>
                    <button type="button" class="pill-categoria" data-categoria-id="3" data-categoria="Bebidas">Bebidas</button>
                    <button type="button" class="pill-categoria" data-categoria-id="4" data-categoria="Higiene">Higiene</button>
                </div>
            </div>

            <!-- 2. CARDS DE RESUMO DA CATEGORIA SELECIONADA -->
            <div class="cards-resumo-grid">
                <div class="card-metrica">
                    <span class="titulo-metrica">Média na Categoria</span>
                    <span class="valor-metrica" id="valMediaCategoria">R$ 0,00</span>
                </div>
                <div class="card-metrica">
                    <span class="titulo-metrica" id="labelMesMaisAlto">Mês mais Alto</span>
                    <span class="valor-metrica" id="valMesMaisAlto">R$ 0,00</span>
                </div>
                <div class="card-metrica">
                    <span class="titulo-metrica">Total no Ano</span>
                    <span class="valor-metrica" id="valTotalAno">R$ 0,00</span>
                </div>
            </div>

            <!-- 3. GRÁFICO DE BARRAS DOS ÚLTIMOS 12 MESES -->
            <div class="bloco-grafico-container">
                <h3 id="tituloGrafico">Evolução Mensal — Alimentos</h3>
                <div class="grafico-barras" id="containerGrafico">
                    <!-- Gerado dinamicamente via JS -->
                </div>
            </div>

        </section>
    </main>

    <script src="Gmmc.js"></script>
</body>
</html>
