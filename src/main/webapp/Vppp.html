<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variação de Preço por Produto</title>
    <link rel="stylesheet" href="Vppp.css">
</head>
<body>

    <!-- Cabeçalho (Padrão do Sistema) -->
    <header class="cabecalho">
        <div class="perfil-saudacao">
            <a href="HomePage.html" class="btn-voltar" title="Voltar para a Home">
                <img src="img/homepage.png" alt="Voltar">
            </a>
            <div class="avatar-perfil">
                <img src="img/perfil.png" alt="Foto de Perfil">
            </div>
            <h1 class="Saudacao">Olá Gabriel Dutra</h1>
        </div>

        <div class="ChatNotificacoes">
            <button type="button"><img src="img/balao-de-fala.png" alt="Chat"></button>
            <button type="button"><img src="img/notificacao.png" alt="Notificações"></button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="dashboard-flex">
        <section class="box-relatorio-conteudo">
            
            <!-- 1. CAMPO DE PESQUISA COM AUTOCOMPLETE -->
            <div class="busca-produto-container">
                <label for="input-busca-produto" class="titulo-busca">Pesquisar Produto</label>
                <div class="input-wrapper">
                    <span class="icone-busca">🔍</span>
                    <input type="text" id="input-busca-produto" placeholder="Digite o nome do produto para ver a flutuação..." autocomplete="off">
                </div>
                
                <!-- Lista suspensa de sugestões (Preenchida via JS) -->
                <ul class="sugestoes-autocomplete" id="sugestoes-autocomplete" style="display: none;"></ul>
            </div>

            <!-- 2. CABEÇALHO DO PRODUTO SELECIONADO -->
            <div class="resultado-produto-wrapper">
                <div class="cabecalho-produto-selecionado">
                    <h2 class="nome-produto-destaque" id="nomeProdutoDestaque">Selecione um Produto</h2>
                    <span class="tag-categoria" id="tagCategoria" style="display: none;">-</span>
                </div>

                <!-- Cards de Métricas de Preço -->
                <div class="cards-resumo-grid">
                    <div class="card-metrica">
                        <span class="titulo-metrica">Menor Preço Pago</span>
                        <span class="valor-metrica" id="valMenorPreco" style="color: #166534;">R$ 0,00</span>
                    </div>
                    <div class="card-metrica">
                        <span class="titulo-metrica">Maior Preço Pago</span>
                        <span class="valor-metrica" id="valMaiorPreco" style="color: #991b1b;">R$ 0,00</span>
                    </div>
                    <div class="card-metrica">
                        <span class="titulo-metrica">Preço Atual</span>
                        <span class="valor-metrica" id="valPrecoAtual">R$ 0,00</span>
                    </div>
                </div>

                <!-- 3. GRÁFICO DE FLUTUAÇÃO DE PREÇO -->
                <div class="bloco-grafico-container">
                    <h3>Histórico de Flutuação de Preço (Por Data de Compra)</h3>
                    
                    <div class="grafico-container-geral">
                        <!-- Eixo Y com os intervalos de preço à esquerda -->
                        <div class="eixo-y" id="eixoY">
                            <span class="label-eixo">R$ -</span>
                            <span class="label-eixo">R$ -</span>
                            <span class="label-eixo">R$ -</span>
                            <span class="label-eixo">R$ -</span>
                        </div>

                        <!-- Área interna do Gráfico -->
                        <div class="grafico-barras grafico-flutuacao" id="containerPontos">
                            
                            <!-- Linha SVG que conecta os pontos dinamicamente -->
                            <svg class="linha-flutuacao-svg" preserveAspectRatio="none" viewBox="0 0 100 100">
                                <polyline id="linhaPolyline" points="" fill="none" stroke="#562a22" stroke-width="2.5" />
                            </svg>

                            <!-- Os pontos do gráfico serão inseridos dinamicamente pelo JS -->

                        </div>
                    </div>
                </div>

            </div>

        </section>
    </main>

    <script src="Vppp.js"></script>
</body>
</html>
